<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Cornhole</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script type="module" crossorigin src="./assets/cornhole-ChHcCk8W.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/base-CPp2Xu_E.js">
    <link rel="modulepreload" crossorigin href="./assets/index-CqgNokvH.js">
    <link rel="modulepreload" crossorigin href="./assets/UIStats-DQPpJ-PM.js">
    <link rel="modulepreload" crossorigin href="./assets/UIDialog-WFUmtqdf.js">
    <link rel="stylesheet" crossorigin href="./assets/base-Xcqjeygc.css">
    <link rel="stylesheet" crossorigin href="./assets/index-W4JQEYLH.css">
    <link rel="stylesheet" crossorigin href="./assets/cornhole-Duz2OdBV.css">
  </head>
  <body style="opacity: 0">

    <canvas id="canvas"></canvas>
    
    <div id="top-left"></div>
    <div id="top-center">
      <div class="distance-item">
        <span class="digit" id="board-distance">0</span>
        <span class="unit" id="board-units">YDS</span>
      </div>
      <div id="current-team">
        <div id="current-team-up">
          BLUE IS UP
        </div>
        <div id="current-team-bags">
          <div class="team-bag"></div>
          <div class="team-bag"></div>
          <div class="team-bag"></div>
          <div class="team-bag"></div>
        </div>
      </div>
    </div>
    <div id="scoreboard">
      <div id="round-details">
        <div id="round-number">Round 1</div>
        <div id="round-rules">Playing to 10</div>
      </div>
      <div class="team-row" id="team-blue">
        <div class="team-name">Blue Team</div>
        <div class="team-score" id="blue-team-score">0</div>
      </div>
      <div class="team-row" id="team-red">
        <div class="team-name">Red Team</div>
        <div class="team-score" id="red-team-score">0</div>
      </div>
    </div>

    <div id="game-over">
      <div class="content" id="game-over-content">
        <h2 id="game-over-winner" class="red">Red Wins!</h2>
        <div id="game-over-options">
          <button id="btn-exit">Exit</button>
          <button id="btn-replay">Play Again</button>
        </div>
      </div>
    </div>

    <div id="bottom-left">
      <div class="increase-decrease">
        <button id="distance-increase">+</button>
        <button id="distance-decrease">-</button>
      </div>      
    </div>
    <div id="bottom-right">
      <div id="render-stats"></div>
      <div id="lm-status"></div>
    </div>

  </body>
</html>
